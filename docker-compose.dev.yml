# EduGuardian AI - development overrides (hot reload).
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Frontend (Vite): http://localhost:5173   Backend: http://localhost:8000   DB: localhost:5433
services:
  db:
    ports:
      - "5433:5432"

  backend:
    build:
      context: ./backend
      target: dev
    image: eduguardian-backend:dev
    restart: "no"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - appdata:/data

  frontend:
    build:
      context: ./frontend
      target: dev
    image: eduguardian-frontend:dev
    restart: "no"
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: "true"
    ports: !override
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      disable: true

volumes:
  frontend_node_modules:
